<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>实时显示日期和时间</title>
    <script type="text/javascript">
        function showTime()
        {
            var today=new Date();
            var year=today.getFullYear();
            var month=today.getMonth()+1;
            var day=today.getDate();
            var hour=today.getHours();
            var minute=today.getMinutes();
            var second=today.getSeconds();
            document.getElementById("time").innerHTML=year+"年"+month+"月"+day+"日"+String(hour).padStart(2,"0")+":"+String(minute).padStart(2,"0")+":"+String(second).padStart(2,"0");
            window.setTimeout("showTime()",1000);
        }
    </script>
</head>
<body>
    <div id="time"></div>
    <script type="text/javascript">
        showTime();
    </script>
</body>
</html>
