<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>login</title>
    <style>
        *
        {
            font-size:14px;
            margin:0px;
            padding:0px;
        }
        td
        {
            color:#FFFFFF;
        }
    </style>
    <script type="text/javascript">
        function loginCheck(form)
        {
            if(form.username.value=="" || form.username.value==null)
            {
                alert("请输入用户名！");
                form.username.focus();
                return;
            }
            if(form.password.value=="" || form.password.value==null)
            {
                alert("请输入密码！");
                form.password.focus();
                return;
            }
            alert("正在检验账号密码中。");
            form.submit();
        }
    </script>
</head>
<body>
    <table width="322" height="206" border="1" cellpadding="0" cellspacing="0">
        <tr>
            <td height="153" valing="top" background="Images/Login_M_Top.gif">
                <table width="100%" height="153" border="0" cellpadding="0" cellspacing="0">
                    <tr>
                        <td>
                            <form method="post" action="" name="form">
                                <table width="100%" border="0" cellspacing="-2" cellpadding="-2">
                                    <tr>
                                        <td width="20" height="65">&nbsp;</td>
                                        <td width="82">&nbsp;</td>
                                        <td width="200">&nbsp;</td>
                                        <td width="20">&nbsp;</td>
                                    </tr>
                                    <tr>
                                        <td height="34">&nbsp;</td>
                                        <td align="center">&nbsp;&nbsp;管理员：</td>
                                        <td> <!-- event.keyCode的键值为13的按键是Enter键 -->
                                            <input name="username" type="text" id="username" onkeydown="if(event.keyCode==13){ form.password.focus(); }" maxlength="20"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td height="34">&nbsp;</td>
                                        <td align="center">&nbsp;&nbsp;密&nbsp;&nbsp;码：</td>
                                        <td>
                                            <input name="password" type="password" id="password" onkeydown="if(event.keyCode==13){ loginCheck(form); }" maxlength="20"/>
                                        </td>
                                    </tr>
                                </table>
                            </form>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>
                <img src="Images/Login_M_bottom.gif" width="322" height="53" border="0" usemap="#Map"/>
            </td>
        </tr>
    </table>
    <map name="Map">
        <area shape="rect" coords="164,8,246,26" href="#" onclick="window.close();"/>
        <area shape="rect" coords="76,8,158,26" href="#" onclick="loginCheck(form)"/>
    </map>
</body>
</html>
