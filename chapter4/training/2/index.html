<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>获取数字的绝对值</title>
    <script type="text/javascript">
        function getAbs(num)
        {
            if(num<0)
            {
                alert(num+"的绝对值是"+num*-1);
            }else
            {
                alert(num+"的绝对值是"+num);
            }
        }
    </script>
</head>
<body>
    <script type="text/javascript">
        getAbs(-3);
    </script>
</body>
</html>
