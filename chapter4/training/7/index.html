<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>判断登录是否成功</title>
</head>
<body>
    <script type="text/javascript">
        var isLogin=function(username,password)
        {
            if(username=="mr" && password=="mrsoft")
            {
                alert("登录成功！");
            }else
            {
                alert("微信号或密码不正确！");
            }
        }
        isLogin("mr","mrsoft");
    </script>
</body>
</html>
