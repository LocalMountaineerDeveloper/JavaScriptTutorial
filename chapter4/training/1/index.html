<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>获取完整的收货地址</title>
    <script type="text/javascript">
        function address(province,city,area,detailed)
        {
            document.write(province+city+area+detailed);
        }
    </script>
</head>
<body>
    <h2>请核对您的收货地址</h2>
    <script type="text/javascript">
        address("吉林省","长春市","朝阳区","工农大路51号");
    </script>
</body>
</html>
