<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>输出多层星号金字塔形图案</title>
</head>
<body>
    <script type="text/javascript">
        var star=function(n)
        {
            for(var i=1;i<=n;++i)
            {
                for(var j=1;j<=n-i;++j)
                {
                    document.write("&nbsp;"); //输出空格
                }
                for(var j=1;j<=i;++j)
                {
                    document.write("*&nbsp;");
                }
                document.write("<br>");
            }
        }
        star(5);
    </script>
</body>
</html>
