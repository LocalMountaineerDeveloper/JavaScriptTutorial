<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>函数参数的使用</title>
    <script type="text/javascript">
        function show(bookname,author)
        {
            alert("书名："+bookname+"\n作者："+author);
        }
    </script>
</head>
<body>
    <script type="text/javascript">
        show("JavaScript从入门到精通","明日科技");
    </script>
</body>
</html>
