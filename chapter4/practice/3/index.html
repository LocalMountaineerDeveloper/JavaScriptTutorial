<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>输出自定义的表格</title>
    <script type="text/javascript">
        function createTable(row,col,width,height,bdColor)
        {
            var tableStr="";
            tableStr+=("<table style='width:"+width+"px;height:"+height+"px;border-collapse:collapse'>");
            for(var i=0;i<row;++i)
            {
                tableStr+=("<tr>");
                for(var j=0;j<col;++j)
                {
                    tableStr+=("<td style='border:1px solid "+bdColor+"';></td>");
                }
                tableStr+=("</tr>");
            }
            tableStr+=("</table>");
            return tableStr;
        }
    </script>
</head>
<body>
    <script type="text/javascript">
        document.write(createTable(5,6,500,260,"green"));
    </script>
</body>
</html>
