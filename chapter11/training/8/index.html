<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>显示拖放事件的描述</title>
    <script type="text/javascript">
        function dragObject(e)
        {
            switch(e.type)
            {
                case "dragover":
                    e.preventDefault(); //阻止默认行为，即允许被拖动
                    document.title="在目标容器范围内进行拖动";
                    break;
                case "dragleave":
                    document.title="对象离开目标容器";
                    break;
                case "drop":
                    e.preventDefault();
                    var pic=document.getElementById("pic");
                    e.target.appendChild(pic); //移动被拖放的元素
                    document.title="在目标容器中放下该对象";
                    break;
                default:
                    break;
            }
        }
    </script>
</head>
<link href="css/style.css" type="text/css" rel="stylesheet"/>
<body>
    <div class="mr-cont">
        <div id="left" ondragover="dragObject(event)" ondragleave="dragObject(event)" ondrop="dragObject(event)">
            <img src="img/face.png" id="pic"/>
        </div>
        <div id="right" ondragover="dragObject(event)" ondragleave="dragObject(event)" ondrop="dragObject(event)"></div>
    </div>
</body>
</html>
