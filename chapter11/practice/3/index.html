<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>操作按钮的样式</title>
    <script type="text/javascript">
        function mouseDown(e)
        {
            e.target.style.backgroundColor="green";
            e.target.style.color="white";
        }
        function mouseUp(e)
        {
            e.target.style.backgroundColor="";
            e.target.style.color="";
        }
    </script>
</head>
<body>
    <input id="btn" type="button" value="测试" onmousedown="mouseDown(event)" onmouseup="mouseUp(event)"/>
</body>
</html>
