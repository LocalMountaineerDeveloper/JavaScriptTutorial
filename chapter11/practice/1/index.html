<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>实现文字变色和放大</title>
    <script type="text/javascript">
        function txtChange()
        {
            var obj=document.getElementById("welcome");
            obj.style.color="#0000ff";
            obj.style.fontSize="24px";
        }
        function txtResume()
        {
            var obj=document.getElementById("welcome");
            obj.style.color="#000000";
            obj.style.fontSize="18px";
        }
    </script>
</head>
<body>
    <span id="welcome" style="font-size:18px" onmouseover="txtChange()" onmouseout="txtResume()">欢迎购买明日科技图书</span>
</body>
</html>
