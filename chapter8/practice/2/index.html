<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>验证用户注册信息</title>
    <script type="text/javascript">
        function checkInput()
        {
            var user=form.user.value; //获取用户名文本框的值
            var checkUser=/^[a-zA-Z]\w{4,15}$/;
            if(checkUser.test(user))
            {
                userBox.innerHTML="<span class='green'>用户名符合要求</span>";
            }else
            {
                userBox.innerHTML="<span id='userBox'>*必须是以字母开头、可包含字母、数字或下划线，长度5-16个字节</span>"
            }
            var password=form.password.value; //获取密码文本框的值
            var checkPassword=/^[a-zA-Z0-9]{6,12}$/;
            if(checkPassword.test(password))
            {
                passwordBox.innerHTML="<span class='green'>密码符合要求</span>";
            }else
            {
                passwordBox.innerHTML="<span class='red'>*可包含字母、数字、长度6-12个字节</span>";
            }
        }
    </script>
</head>
<style type="text/css">
    body, td, th
    {
        font-size:12px;
    }
    .red
    {
        color:red;
    }
    .green
    {
        color:green;
    }
</style>
<body>
    <form name="form" method="POST" action="#">
        用户名：<input type="text" name="user" id="user">
        <span id="userBox" class="red">*必须是以字母开头、可包含字母、数字或下划线，长度5-16个字节</span><br>
        密&emsp;码：<input type="password" name="password" id="password">
        <span id="passwordBox" class="red">*可包含字母、数字，长度6-12个字节</span><br>
        <input type="button" name="button" value="测试" onclick="checkInput()">
    </form>
</body>
</html>
