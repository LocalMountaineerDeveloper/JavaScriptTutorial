<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>匹配字符“^”的使用</title>
</head>
<body>
    <h3>行首匹配字符^的使用</h3>
    <script type="text/javascript">
        var regExpression=/^Java/;
        var testString="JavaScript";
        var result=regExpression.test(testString);
        if(result)
        {
            document.write("正则表达式/^Java/匹配字符串\""+testString+"\"<br>");
        }else
        {
            alert("未找到匹配的模式！");
        }
    </script>
</body>
</html>
