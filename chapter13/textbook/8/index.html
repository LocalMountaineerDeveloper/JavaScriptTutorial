<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>在页面的指定位置显示当前日期</title>
    <script type="text/javascript">
        function clockOn()
        {
            var now=new Date();
            var year=now.getFullYear();
            var month=now.getMonth()+1;
            var date=now.getDate();
            var day=now.getDay();
            var hour=String(now.getHours()).padStart(2,"0");
            var minute=String(now.getMinutes()).padStart(2,"0");
            var second=String(now.getSeconds()).padStart(2,"0");
            var week_array=["周日","周一","周二","周三","周四","周五","周六",];
            var week=week_array[day];
            var time=year+"年"+month+"月"+date+"日"+week+" "+hour+":"+minute+":"+second;
            var time_textNode=document.createTextNode(time);
            document.getElementById("clock").appendChild(time_textNode);
        }
    </script>
</head>
<body>
    <div id="clock">当前日期：</div>
    <script type="text/javascript">
        window.onload=clockOn;
    </script>
</body>
</html>
