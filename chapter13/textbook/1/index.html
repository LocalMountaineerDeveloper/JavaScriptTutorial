<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>访问指定结点</title>
</head>
<body>
    <div id="demo">天生我材必有用</div>
    <script type="text/javascript">
        var demo=document.getElementById("demo");
        var str;
        str="结点名称："+demo.nodeName+"\n";
        str+="结点类型："+demo.nodeType+"\n";
        str+="结点值："+demo.nodeValue+"\n";
        alert(str);
    </script>
</body>
</html>
