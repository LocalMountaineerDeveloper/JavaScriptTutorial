<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>动态添加文本框</title>
    <script type="text/javascript">
        function addText()
        {
            var txt=document.createElement("input");
            txt.type="text";
            txt.name="txt";
            txt.value="JavaScript从入门到精通";
            document.form.appendChild(txt);
        }
    </script>
</head>
<body>
    <form name="form">
        <input type="button" name="btn" value="添加文本框" onclick="addText()"/>
    </form>
</body>
</html>
