<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>在文档中输出数据</title>
</head>
<body>
    <script type="text/javascript">
        document.write("<p>枫桥夜泊</p>")
        document.writeln("月落乌啼霜满天，");
        document.writeln("江枫渔火对愁眠。");
        document.writeln("姑苏城外寒山寺，");
        document.writeln("夜半钟声到客船。");
    </script>
    <pre>
        <script type="text/javascript">
            document.write("<p>枫桥夜泊</p>")
            document.writeln("月落乌啼霜满天，");
            document.writeln("江枫渔火对愁眠。");
            document.writeln("姑苏城外寒山寺，");
            document.writeln("夜半钟声到客船。");
        </script>
    </pre>
</body>
</html>
