<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>获取文本框并修改其内容</title>
    <script type="text/javascript">
        function changeText()
        {
            var t=document.getElementById("txt");
            t.value="水不在深，有龙则灵。";
        }
    </script>
</head>
<body>
    <input type="text" id="txt" value="山不在高，有仙则名。"/>
    <input type="button" name="btn" value="修改文本框内容" onclick="changeText()"/>
</body>
</html>
