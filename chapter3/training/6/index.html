<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script type="text/javascript">
        var sum=0;
        for(var i=1;i<=1000;++i)
        {
            if(i%65!=0)
            {
                continue;
            }
            sum+=i;
        }
        alert("1~1000以内所有65的倍数的和为："+sum);
    </script>
</body>
</html>
