<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script type="text/javascript">
        var baseWage=3000;
        var year=0;
        var ageWage=0;
        do
        {
            ++year;
            ageWage=50*year;
            document.write("员工工作"+year+"年后的工资为<b>"+(baseWage+ageWage)+"</b>元<br>");
        }while(year<5);
    </script>
</body>
</html>
