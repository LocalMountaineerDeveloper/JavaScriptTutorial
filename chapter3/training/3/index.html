<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script type="text/javascript">
        var month=2;
        var season="";
        switch(month)
        {
            case 3:
            case 4:
            case 5:
                season="春季";
                break;
            case 6:
            case 7:
            case 8:
                season="夏季";
                break;
            case 9:
            case 10:
            case 11:
                season="秋季";
                break;
            case 12:
            case 1:
            case 2:
                season="冬季";
                break;
            default:
                break;
        }
        document.write("现在是"+month+"月");
        document.write("<br>当前月份属于"+season);
    </script>
</body>
</html>
