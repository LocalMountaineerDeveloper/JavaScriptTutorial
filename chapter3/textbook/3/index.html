<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>输出考试成绩对应的等级</title>
</head>
<body>
    <script type="text/javascript">
        var grade="";
        var score=66;
        if(score>=90)
        {
            grade="A";
        }else if(score>=75)
        {
            grade="B";
        }else if(score>=60)
        {
            grade="C";
        }else
        {
            grade="D";
        }
        alert("该学生考试成绩的等级是"+grade);
    </script>
</body>
</html>
