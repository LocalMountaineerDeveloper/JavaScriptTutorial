<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>计算100以内偶数的和</title>
</head>
<body>
    <script type="text/javascript">
        var sum=0;
        for(var i=0;i<100;i+=2)
        {
            sum+=i;
        }
        alert("100以内所有偶数的和为："+sum);
    </script>
</body>
</html>
