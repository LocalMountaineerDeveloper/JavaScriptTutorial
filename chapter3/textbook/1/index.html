<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>获取三个数的最大值</title>
</head>
<body>
    <script type="text/javascript">
        var a,b,c,maxValue;
        a=16;
        b=23;
        c=37;
        maxValue=a;
        if(maxValue<b)
        {
            maxValue=b;
        }
        if(maxValue<c)
        {
            maxValue=c;
        }
        alert(a+" "+b+" "+c+"三个数的最大值为"+maxValue);
    </script>
</body>
</html>
