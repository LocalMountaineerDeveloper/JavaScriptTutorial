<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>判断某女职工是否已退休</title>
</head>
<body>
    <script type="text/javascript">
        var sex="女";
        var age=52;
        if(sex=="男")
        {
            if(age>=60)
            {
                alert("该男职工已经退休"+(age-60)+"年。");
            }else
            {
                alert("该男职工并未退休。");
            }
        }else
        {
            if(age>=55)
            {
                alert("该女职工已经退休"+(age-55)+"年。");
            }else
            {
                alert("该女职工并未退休。");
            }
        }
    </script>
</body>
</html>
