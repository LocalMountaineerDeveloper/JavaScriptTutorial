<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>输出乘法口诀表</title>
</head>
<body>
    <h3>乘法口诀表</h3>
    <script type="text/javascript">
        document.write("<pre>");
        for(var i=1;i<=9;++i)
        {
            for(var j=1;j<=i;++j)
            {
                if(j>1)
                {
                    document.write("\t");
                }
                document.write(j+"×"+i+"="+j*i);
            }
            document.write("<br>");
        }
        document.write("</pre>");
    </script>
</body>
</html>
