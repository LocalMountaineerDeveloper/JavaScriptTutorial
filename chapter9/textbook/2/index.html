<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>使用try catch finally语句处理异常</title>
</head>
<body>
    <script type="text/javascript">
        try
        {
            alert(document.getElementById("demo").innerHTML);
        }catch(exception)
        {
            alert("未定义id属性是demo的元素");
        }finally
        {
            alert("结束try catch finally语句");
        }
    </script>
</body>
</html>
