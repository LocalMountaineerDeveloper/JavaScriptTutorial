<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>使用嵌套try catch语句处理异常</title>
</head>
<body>
    <script type="text/javascript">
        try
        {
            alert(document.getElementById("demo").innerHTML); //获取指定元素的HTML内容
        }catch(exception)
        {
            alert("未定义id属性值是demo的元素");
            try
            {
                alert(document.getElementById("test").innerHTML);
            }catch(exception2)
            {
                alert("未定义id属性值是test的元素");
            }
        }finally
        {
            alert("结束try catch finally语句");
        }
    </script>
</body>
</html>
