<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>使用onerror事件处理异常</title>
    <script type="text/javascript">
        window.onerror=function(ms,url,line)
        {
            alert("您调用的函数不存在！\n"+ms+"\n"+url+"\n"+line+"\n");
            return true;
        }

        function imgLoad()
        {
            document.images[0].onerror=function()
            {
                alert("您调用的图像并不存在！\n");
            }
        }
    </script>
</head>
<body onload="imgLoad()()">
    <script type="text/javascript">
        onHave();
        document.images[0].src="test.gif";
    </script>
</body>
</html>
