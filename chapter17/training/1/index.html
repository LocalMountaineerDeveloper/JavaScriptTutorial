<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>模拟自动取票机取票</title>
    <style>
        body
        {
            font-size:14px;
        }
        span
        {
            margin-left:10px;
        }
    </style>
    <script type="text/javascript">
        var ticketCode="99632570063166";
        function checkCode(form)
        {
            var code=form.code.value;
            if(code==="")
            {
                alert("请输入兑换码！");
                return false;
            }else if(code===ticketCode)
            {
                alert("取票成功！")
                return true;
            }else
            {
                alert("兑换码错误！");
                return false;
            }
        }
    </script>
</head>
<body>
    <table width="300" height="100" bgcolor="#1170FF" border="0" cellpadding="0" cellspacing="1">
        <form name="ticket_form" method="post">
            <tr>
                <td height="25" colspan="2" bgcolor="#B5D3FF">
                    <div align="center">
                        取票系统
                    </div>
                </td>
            </tr>
            <tr>
                <td width="120" height="25" bgcolor="#FFFFFF">
                    <div align="right">请输入兑换码：</div>
                </td>
                <td width="180" bgcolor="#FFFFFF">
                    &nbsp;
                    <input type="text" name="code" size="15"/>
                </td>
            </tr>
            <tr>
                <td height="25" colspan="2" bgcolor="#FFFFFF">
                    <div align="center">
                        <input type="submit" value="取票" onclick="return checkCode(document.ticket_form);"/>
                        &nbsp;&nbsp;
                        <input type="reset" value="重置输入"/>
                    </div>
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
