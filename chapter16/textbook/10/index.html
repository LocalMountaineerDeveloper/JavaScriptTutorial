<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>使用类别选择器</title>
    <style>
        .one
        {
            font-family:宋体;
            font-size:24px;
            color:red;
        }
        .two
        {
            font-family:黑体;
            font-size:16px;
            color:blue;
        }
        .three
        {
            font-family:楷体;
            font-size:12px;
            color:green;
        }
    </style>
</head>
<body>
    <h2 class="one">
        应用了选择器one
    </h2>
    <p>
        正文内容1
    </p>
    <h2 class="two">
        应用了选择器two
    </h2>
    <p>
        正文内容2
    </p>
    <h2 class="three">
        应用了选择器three
    </h2>
    <p>
        正文内容3
    </p>
</body>
</html>
