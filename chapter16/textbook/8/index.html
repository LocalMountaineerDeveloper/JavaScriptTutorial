<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>改变超链接字体样式</title>
    <style>
        body
        {
            font-size:9pt;
        }
        a:hover /* a:hover 表示当鼠标指针悬停在超链接（<a> 元素）上方时所应用的样式。其中 :hover 这部分是伪类选择器，用来指定元素处于某种特殊状态时的样式，hover就是特殊状态的一种 */
        {
            color:#FF0000;
        }
        a
        {
            text-decoration:none;
            color:#3C404D;
        }
        table
        {
            width:44%;
            height:26px;
            margin:0 auto; /*border-collapse 是一个 CSS 属性，用于决定表格（<table>）的边框是合并为单一的边框，还是分开显示独立的边框，*/
            border-collapse:collapse; /* collapse（合并）：相邻的单元格共用同一条边框。边框会合并成单一的边框线。separate（分开，默认值）：每个单元格拥有独立的边框，边框之间保持一定的距离。*/
            padding:-2px; /* inherit：规定应该从父元素继承 border-collapse 属性的值。 */
        }
        table td
        {
            text-align:center;
            background-image:url("Images/bg_Navigate.GIF");
        }
    </style>
    <script type="text/javascript">
        function moveIn(event)
        {
            switch(event)
            {
                case "a":
                    document.getElementById("a").style.fontWeight="bold"; //粗体，数值为700
                    break;
                case "b":
                    document.getElementById("b").style.fontStyle="italic"; //斜体。对于没有斜体变量的特殊字符，将应用oblique倾斜字体。
                    break;
                case "c":
                    document.getElementById("c").style.textDecoration="underline"; //下划线
                    break;
                case "d":
                    document.getElementById("d").style.textDecoration="line-through"; //贯穿线
                    break;
                case "e":
                    document.getElementById("e").style.fontWeight="bold";
                    document.getElementById("e").style.fontStyle="italic";
                    break;
                default:
                    break;
            }
        }

        function moveOut()
        {
            document.getElementById("a").style.fontWeight="normal";
            document.getElementById("b").style.fontStyle="normal";
            document.getElementById("c").style.textDecoration="none";
            document.getElementById("d").style.textDecoration="none";
            document.getElementById("e").style.fontWeight="normal";
        }
    </script>
</head>
<body>
    <p>&nbsp;</p>
    <table>
        <tr>
            <td>
                <a href="#" id="a" onmouseover="moveIn('a');" onmouseout="moveOut();">粗体文字</a>
                <a href="#" id="b" onmouseover="moveIn('b');" onmouseout="moveOut();">斜体文字</a>
                <a href="#" id="c" onmouseover="moveIn('c');" onmouseout="moveOut();">下划线文字</a>
                <a href="#" id="d" onmouseover="moveIn('d');" onmouseout="moveOut();">删除线文字</a>
                <a href="#" id="e" onmouseover="moveIn('e');" onmouseout="moveOut();">粗斜体文字</a>
            </td>
        </tr>
    </table>
</body>
</html>
