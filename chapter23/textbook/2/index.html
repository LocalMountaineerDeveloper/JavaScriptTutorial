<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>插入HTML内容</title>
    <script src="../../vue.global.js"></script>
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded",function()
        {
            let vm=Vue.createApp(
                {
                    data:function()
                    {
                        return{
                            message:"<h2>书籍是人类进步的阶梯</h2>"
                        };
                    }
                }).mount("#app");
        });
    </script>
</head>
<body>
    <div id="app">
        <p v-html="message"></p>
    </div>
</body>
</html>
