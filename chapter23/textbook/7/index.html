<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>v-for指令将数组或对象中的数据循环渲染到DOM中</title>
    <style>
        body
        {
            font-family:微软雅黑,sans-serif;
        }
        .title
        {
            background:#F6F6F6;
            font-size:18px;
        }
        .title,.content
        {
            width:510px;
            height:36px;
            line-height:36px;
            border:1px solid #FF00FF;
        }
        .content
        {
            border-top:none;
            color:green;
            clear:both; /*清除浮动元素对当前元素的影响，both表示左右两边都不允许有浮动元素（最常用）*/
        }
        .title div
        {
            text-align:center;
            float:left;
        }
        .title .col-1, .content .col-1
        { /*逗号把两个选择器并列起来，意思是：只要元素匹配其中任意一个选择器，就应用{}里的样式*/
            width:80px;
        }
        .title .col-2, .content .col-2
        {
            width:270px;
        }
        .content div
        {
            text-align:center;
            float:left;
        }
    </style>
    <script src="../../vue.global.js"></script>
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded",function()
        {
            let vm=Vue.createApp(
                {
                    data:function()
                    {
                        return{
                            books:
                            [
                                {
                                    bookname:"水浒传",
                                    author:"施耐庵",
                                    characters:"宋江、林冲、武松、鲁智深"
                                },
                                {
                                    bookname:"三国演义",
                                    author:"罗贯中",
                                    characters:"刘备 关羽 张飞 曹操 孙权"
                                },
                                {
                                    bookname:"西游记",
                                    author:"吴承恩",
                                    characters:"孙悟空 唐僧 猪八戒 沙和尚"
                                },
                                {
                                    bookname:"红楼梦",
                                    author:"曹雪芹",
                                    characters:"贾宝玉 林黛玉 薛宝钗 王熙凤"
                                },
                            ]
                        }
                    }
                }).mount("#app");
        });
    </script>
</head>
<body>
    <div id="app">
        <div class="title">
            <div class="col-1">序号</div>
            <div class="col-1">书名</div>
            <div class="col-1">作者</div>
            <div class="col-2">主要人物</div>
        </div>
        <div class="content" v-for="(book,index) in books">
            <div class="col-1">{{index+1}}</div>
            <div class="col-1">{{book.bookname}}</div>
            <div class="col-1">{{book.author}}</div>
            <div class="col-2">{{book.characters}}</div>
        </div>
    </div>
</body>
</html>
