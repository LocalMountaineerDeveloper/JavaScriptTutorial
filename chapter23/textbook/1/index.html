<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>文本插值</title>
    <script src="../../vue.global.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function()
        {
            let vm=Vue.createApp(
                {
                    data:function()
                    {
                        return{
                            word:"有志者事竟成"
                        };
                    }
                }).mount("#app");
        });
    </script>
</head>
<body>
    <div id="app">
        <h3>{{word}}</h3>
    </div>
</body>
</html>
