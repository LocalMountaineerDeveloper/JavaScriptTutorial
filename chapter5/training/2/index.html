<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>日期倒计时</title>
    <script type="text/javascript">
        function countdown(title,intime)
        {
            var online=new Date(intime);
            var now=new Date();
            var interval=online.getTime()-now.getTime();
            var day=Math.floor(interval/(1000*60*60*24))+1;
            if(day>1)
            {
                document.write("距"+title+"还有"+day+"天！");
            }else if(day==1)
            {
                document.write("明天就是"+title+"了！");
            }else if(day==0)
            {
                document.write("今天就是"+title+"了！");
            }else
            {
                document.write(title+"已经过去了"+day*(-1)+"天");
            }
        }
    </script>
</head>
<body>
    <script type="text/javascript">
        countdown("2024年高考","2024-6-7");
    </script>
</body>
</html>
