<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>计算从出生到现在度过的时间</title>
    <script type="text/javascript">
        function calculate(birthYear,birthMonth,birthDay)
        {
            var result="周星星从出生到现在已度过了<br>";
            var now=new Date();
            var birth=new Date(birthYear,birthMonth,birthDay);
            var interval=now-birth;
            var days=parseInt(interval/(1000*60*60*24));
            var hours=parseInt(interval%(1000*60*60*24)/(1000*60*60));
            var minutes=parseInt(interval%(1000*60*60*24)%(1000*60*60)/(1000*60));
            var seconds=parseInt(interval%(1000*60*60*24)%(1000*60*60)%(1000*60)/1000);
            result+=days+"天>>>"+hours+"小时>>>"+minutes+"分>>>"+seconds+"秒";
            return result;
        }
    </script>
</head>
<body>
    <script type="text/javascript">
        document.write(calculate(1996,6,9));
    </script>
</body>
</html>
