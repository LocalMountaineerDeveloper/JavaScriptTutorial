<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>创建可移动和可关闭的窗口</title>
    <style type="text/css">
        .style1
        {
            font-size:13px;
        }
    </style>
    <script type="text/javascript">
        var obj="none";
        var pX,pY;
        function div_down(tag,e)
        {
            obj=tag;
            pX=e.x-parseInt(document.getElementById(obj).style.left);
            pY=e.y-parseInt(document.getElementById(obj).style.top);
        }
        function div_move(e)
        {
            if(obj!="none")
            {
                document.getElementById(obj).style.left=e.x-pX+"px";
                document.getElementById(obj).style.top=e.y-pY+"px";
            }
        }
        function div_up()
        {
            obj="none";
        }
        function hide(divId)
        {
            document.getElementById(divId).style.visibility="hidden";
        }
    </script>
</head>
<body style="background-color:#ADBAB1">
    <div id="div1" style="visibility:visible; background-color:#FFFF00; position:absolute; top:60px; left:200px; width:360px; height:170px;">
        <div id="title" onmousedown="div_down('div1',event)" style="background-color:#30608F; padding:2px; font-size:13px; text-indent:5px; color:#FFFFFF; cursor:move">明日学院</div>
        <img id="close" onclick="hide('div1')" style="position:absolute; right:2px; top:2px" src="close.gif" width="15" height="15"/>
        <span clsee="style1"><br>
            &emsp;&emsp;明日学院，是吉林省明日科技有限公司倾力打造的在线实用技能学习平台，该平台于2016年正式上线，主要为学习者提供海量、优质的课程，课程结构严谨，用户可以根据自身的学习程度，自主安排学习进度。我们的宗旨是，为编程学习者提供一站式服务，培养用户的编程思想。
        </span>
    </div>
    <script type="text/javascript">
        document.onmousemove=div_move;
        document.onmouseup=div_up;
    </script>
</body>
</html>
