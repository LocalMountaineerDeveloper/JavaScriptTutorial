<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>计算今天距离明年元旦的天数</title>
</head>
<body>
    <script type="text/javascript">
        var date1=new Date();
        var theNextYear=date1.getFullYear()+1;
        date1.setFullYear(theNextYear);
        date1.setMonth(0);
        date1.setDate(1);
        var date2=new Date();
        var date3=date1.getTime()-date2.getTime(); //获取两个日期相差的毫秒数
        var days=Math.ceil(date3/(24*60*60*1000)); //将毫秒数转换成天数
        alert("今天距离明年元旦还有"+days+"天。");
    </script>
</body>
</html>
