<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>输出数组元素</title>
</head>
<body>
    <script type="text/javascript">
        var goods=new Array(3);
        goods[0]="自拍杆";
        goods[1]="无线鼠标";
        goods[2]="扫地机器人";
        for(var i=0;i<3;++i)
        {
            document.write("第"+(i+1)+"个商品名称是"+goods[i]+"<br>");
        }
    </script>
</body>
</html>
