<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>获取数组中的指定元素</title>
</head>
<body>
    <script type="text/javascript">
        var array=[1,2,3,4,5,6];
        document.write("原数组："+array+"<br>");
        document.write("数组中第2个到倒数第2个元素："+array.slice(1,-1));
    </script>
</body>
</html>
