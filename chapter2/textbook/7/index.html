<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>比较运算符的使用</title>
</head>
<body>
    <script type="text/javascript">
        var score=60;
        document.write("score变量的值为："+score);
        document.write("<br>");
        document.write("score>60：");
        document.write(score>60);
        document.write("<br>");
        document.write("score<60：");
        document.write(score<60);
        document.write("<br>");
        document.write("score=='60'：");
        document.write(score=='60');
        document.write("<br>");
        document.write("score==='60'：");
        document.write(score==='60');
        document.write("<br>");
        document.write("score===60：");
        document.write(score===60);
    </script>
</body>
</html>
