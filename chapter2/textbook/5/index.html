<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>将华氏度转换为摄氏度</title>
</head>
<body>
    <h2>某城市当前气温</h2>
    <script type="text/javascript">
        var degreeF=77;
        var degreeC;
        degreeC=5/9*(degreeF-32);
        document.write("华氏度："+degreeF+"&deg;F");
        document.write("<br>摄氏度："+degreeC+"&deg;C");
    </script>
</body>
</html>
