<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>输出红、绿、蓝3种颜色的色值</title>
</head>
<body>
    <script type="text/javascript">
        document.write("RGB颜色#EE567C的3种颜色的色值分别为：");
        document.write("<p>R:"+0xEE);
        document.write("<br>G:"+0x56);
        document.write("<br>B:"+0x7C);
    </script>
</body>
</html>
