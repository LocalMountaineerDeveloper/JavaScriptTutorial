<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>逻辑运算符的使用</title>
</head>
<body>
    <script type="text/javascript">
        var num=10;
        document.write("num="+num);
        document.write("<p>num>0 && num<5的结果：");
        document.write(num>0 && num<5);
        document.write("<br>num>0 || num<5的结果：");
        document.write(num>0 || num<5);
        document.write("<br>!num<5的结果：");
        document.write(!num<5);
        document.write("</p>");
    </script>
</body>
</html>
