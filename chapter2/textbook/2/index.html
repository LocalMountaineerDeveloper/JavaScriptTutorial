<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>输出科学计数法表示的浮点数</title>
</head>
<body>
    <script type="text/javascript">
        document.write("科学计数法表示的浮点数的输出结果："); //输出字符串
        document.write("<p>"); //输出段落标记
        document.write(2e+3);
        document.write("<br>");
        document.write(5.6e7);
        document.write("<br>");
        document.write(1.365E-2);
    </script>
</body>
</html>
