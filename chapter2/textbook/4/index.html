<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>输出球员信息</title>
    <style type="text/css">
        *
        {
            font-size:18px;
            line-height:30px;
        }
    </style>
</head>
<body>
    <h1 style="font-size:24px;">迈克尔·乔丹</h1>
    <script type="text/javascript">
        var alias="飞人";
        var height=198;
        var score=32292;
        var achivement="6次NBA总冠军";
        var position="得分后卫/小前锋";
        document.write("别名：");
        document.write(alias);
        document.write("<br>身高：");
        document.write(height);
        document.write("cm<br>总得分：");
        document.write(score);
        document.write("分<br>主要奖项：");
        document.write(achivement);
        document.write("<br>场上位置：");
        document.write(position);
    </script>
</body>
</html>
