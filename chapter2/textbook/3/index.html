<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>输出奥尼尔的英文名和别名</title>
    <style type="text/css">
        *
        {
            font-size:18px;
        }
    </style>
</head>
<body>
    <script type="text/javascript">
        document.write("<pre>"); //在document.write()语句中使用转义字符时，只有放在格式化文本块中才会起作用
        document.write("\n 英文名：Shaquille O\'Neal");
        document.write("\n 别名：大鲨鱼");
        document.write("</pre>");
    </script>
</body>
</html>
