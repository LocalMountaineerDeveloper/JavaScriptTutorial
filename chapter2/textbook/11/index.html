<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>运算符优先级的使用</title>
</head>
<body>
    <script type="text/javascript">
        var balance=10;
        var call=0.1;
        var traffic=0.3;
        var minutes=(balance-traffic*30)/call;
        document.write("手机话费余额还可以通话"+minutes+"min");
    </script>
</body>
</html>
