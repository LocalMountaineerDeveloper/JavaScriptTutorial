<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>赋值运算符的使用</title>
</head>
<body>
    <script type="text/javascript">
        var a=2;
        var b=3;
        document.write("a=2,b=3");
        document.write("<p>");
        document.write("a+=b运算后：");
        a+=b;
        document.write("a="+a);
        document.write("<br>");
        document.write("a-=运算后：");
        a-=b;
        document.write("a="+a);
        document.write("<br>");
        document.write("a*=b运算后：");
        a*=b;
        document.write("a="+a);
        document.write("<br>");
        document.write("a/=b运算后：");
        a/=b;
        document.write("a="+a);
        document.write("<br>");
        document.write("a%=b运算后：");
        a%=b;
        document.write("a="+a);
        document.write("</p>");
    </script>
</body>
</html>
