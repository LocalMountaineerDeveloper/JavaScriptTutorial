<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script type="text/javascript">
        var rate=2.75;
        var money=100000;
        var year=3;
        document.write("存款金额："+money+"元");
        document.write("<br>年利率："+rate+"%");
        document.write("<br>存款期限："+year+"年");
        var total=money+money*(rate/100)*year;
        document.write("<br>本息合计："+total+"元");
    </script>
</body>
</html>
