<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>统计考试分数</title>
    <script type="text/javascript">
        class Exam
        {
            constructor(math,chinese,english,physics,chemistry)
            {
                this.math=math;
                this.chinese=chinese;
                this.english=english;
                this.physics=physics;
                this.chemistry=chemistry;
            }

            total()
            {
                document.write("数学："+this.math);
                document.write("<br>语文"+this.chinese);
                document.write("<br>英语"+this.english);
                document.write("<br>物理"+this.physics);
                document.write("<br>化学"+this.chemistry);
                document.write("<br>--------------------------");
                document.write("<br>总分："+(this.math+this.chinese+this.english+this.physics+this.chemistry));
            }
        }
    </script>
</head>
<body>
    <script type="text/javascript">
        var e=new Exam(65,69,76,90,96);
        e.total();
    </script>
</body>
</html>
