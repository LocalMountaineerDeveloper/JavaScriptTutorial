<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>动态调整图像透明度</title>
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded",function()
        {
            let opacity=document.getElementById("slider").value;
            let pic=document.getElementById("pic");
            let text=document.getElementById("sliderValue");
            function opacityChange()
            {
                opacity=document.getElementById("slider").value;
                pic.style.opacity=String(opacity/100);
                text.innerText=opacity+"%";
            }
            document.getElementById("slider").addEventListener("change",opacityChange);
        });
    </script>
</head>
<body>
    <div class="content">
        <img id="pic" src="img/pic.jpg" alt="pic.jpg"/>
        <div>
            <label for="slider">拖动滑块设置透明度：</label>
            <input id="slider" type="range" max="100" min="0" value="100"/>
            <span id="sliderValue">100%</span>
        </div>
    </div>
</body>
</html>
