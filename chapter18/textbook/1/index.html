<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>使用预装载图像制作幻灯效果</title>
    <script type="text/javascript">
        var images=[];
        for(var i=0;i<=8;++i)
        {
            images[i]=new Image();
            images[i].src="image/"+i+".png";
        }

        document.addEventListener("DOMContentLoaded",function()
        {
            var i=0;
            var div=document.getElementById("div0");
            function showImage()
            {
                if(i==9)
                {
                    i=0;
                }else
                {
                    ++i;
                }
                div.innerHTML="<img src='"+images[i].src+"'/>";
            }
            window.setInterval(showImage,1000);
        });
    </script>
</head>
<body>
    <div id="div0" align="center"></div>
</body>
</html>
