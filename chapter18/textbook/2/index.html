<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>按时间随机变化的网页背景</title>
    <script type="text/javascript">
        function randomBackground()
        {
            var i=Math.floor(Math.random()*3);
            switch(i)
            {
                case 0:
                    document.body.background="0.jpg";
                    break;
                case 1:
                    document.body.background="1.jpg";
                    break;
                case 2:
                    document.body.background="2.jpg";
                    break;
                default:
                    break;
            }
        }
        document.addEventListener("DOMContentLoaded",function()
        {
            window.setInterval(randomBackground,3000);
        });
    </script>
</head>
<body background="0.jpg">
    
</body>
</html>
